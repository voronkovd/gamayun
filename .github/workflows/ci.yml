name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
      - name: Build linux/${{ matrix.goarch }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags="-s -w -X github.com/voronkovd/gamayun/internal/version.Version=${GITHUB_SHA::7} -X github.com/voronkovd/gamayun/internal/version.Repo=${GITHUB_REPOSITORY}" \
            -o dist/gamayun-linux-${{ matrix.goarch }} ./cmd/gamayun
      - uses: actions/upload-artifact@v7
        with:
          name: gamayun-linux-${{ matrix.goarch }}
          path: dist/gamayun-linux-${{ matrix.goarch }}
