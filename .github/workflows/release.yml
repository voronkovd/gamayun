name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          VER="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          LDFLAGS="-s -w -X github.com/voronkovd/gamayun/internal/version.Version=${VER} -X github.com/voronkovd/gamayun/internal/version.Repo=${REPO}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/gamayun-linux-amd64 ./cmd/gamayun
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/gamayun-linux-arm64 ./cmd/gamayun
          ./scripts/build-deb.sh "${VER}" amd64 dist/gamayun-linux-amd64
          ./scripts/build-deb.sh "${VER}" arm64 dist/gamayun-linux-arm64
          (cd dist && sha256sum gamayun-linux-amd64 gamayun-linux-arm64 gamayun_*.deb > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/gamayun-linux-amd64
            dist/gamayun-linux-arm64
            dist/gamayun_*.deb
            dist/SHA256SUMS
