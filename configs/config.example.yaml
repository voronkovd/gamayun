# Sample config. The installer copies this to
# /etc/gamayun/config.yaml (mode 0600) and does not overwrite an existing file.
#
# Secrets can stay here or come from the environment:
#   TG_BOT_TOKEN, TG_CHAT_ID
# Environment variables override values in this file.

# Name in alerts and the daily digest. Empty = machine hostname.
server_name: my-vps

telegram:
  bot_token: "123456:ABC-DEF..."
  chat_id: "123456789"

# What to check and how often.
checks:
  interval: 60s
  # auto — skip nginx if the unit is not installed
  # on   — always check
  # off  — never check
  nginx: auto
  disk_pct_max: 85
  cert_days_min: 14
  mem_avail_min_mb: 150
  load15_max: 2.0
  # Containers that must be running. Empty list — do not check.
  containers: []
  # containers:
  #   - marzban-marzban-1
  #   - amnezia-node-agent

# When to send PROBLEM / REMIND / RECOVERED.
alerts:
  fail_streak: 2          # consecutive FAILs before PROBLEM
  recover_streak: 1       # consecutive OKs for RECOVERED
  escalation:             # pauses after PROBLEM and between reminders
    - 5m
    - 30m
    - 2h

# Daily digest (machine local time).
digest:
  at: "08:00"

# Where to write FSM state and incident history.
paths:
  state: /var/lib/gamayun/state.json

# Where to fetch updates (`gamayun --update`).
# If the binary was built in GitHub Actions, owner/name is already baked in — this line is optional.
# update:
#   github_repo: voronkovd/gamayun
